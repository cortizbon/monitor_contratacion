name: SECOP ETL Weekly

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ETL dependencies
        run: |
          pip install --upgrade pip
          pip install -r etl/requirements-etl.txt

      - name: Run weekly SECOP snapshot ETL
        run: |
          python etl/ingest_secop_daily.py

      - name: Commit updated parquet snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/secop1.parquet data/secop2.parquet

          if git diff --cached --quiet; then
            echo "No hay cambios en los datasets."
          else
            git commit -m "Update weekly SECOP snapshots"
            git push
          fi